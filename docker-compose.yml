services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prescriptionly-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - APP_NAME=${APP_NAME:-Prescriptionly}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - STORAGE_LOCAL_DIR=/app/uploads
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-15728640}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - AUTO_SEED=${AUTO_SEED:-false}
    volumes:
      - prescriptionly_uploads:/app/uploads
    # extra_hosts enables connecting to host's MySQL (e.g. host.docker.internal) on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prescriptionly

volumes:
  prescriptionly_uploads:
    driver: local

networks:
  # Fixed subnet so the host MySQL grant (see deploy docs) doesn't break every
  # time the compose project is recreated with a different auto-assigned subnet.
  prescriptionly:
    name: prescriptionly
    ipam:
      config:
        - subnet: 172.28.92.0/24
